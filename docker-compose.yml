services:
  postgres:
    image: postgres
    environment:
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"

  redis:
    image: redis
    ports:
      - "6379:6379"

  chat-app:
    build: .
    restart: on-failure
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-app